<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Ex02 - Basic Form Demo</title>
	<link rel="icon"  href="images/world.png">
</head>
<body>
	<h3>HTML - FORM TAGS DEMO</h3>

	<hr>

	<form>
		<table cellpadding="8">
			<tr>
				<td>FIRST NAME: </td>
				<td> <input type="text" placeholder="Enter Your First Name"> </td>
			</tr>

			<tr>
				<td>LAST NAME: </td>
				<td> <input type="text"> </td>
			</tr>

			<tr>
				<td>GENDER: </td>
				<td>
					MALE <input type="radio" name="gender-group" checked>
					FEMALE <input type="radio" name="gender-group">
				</td>
			</tr>

			<tr>
				<td>AGE: </td>
				<td> <input type="number" min="16" max="50" value="18" width="40"> </td>
			</tr>

			<tr>
				<td>COLLEGE: </td>
				<td>
					<select>
						<option value="11">TR1</option>
						<option value="22">TR2</option>
						<option value="33">TR3</option>
					</select>
				</td>
			</tr>

			<tr>
				<td>LANGUAGES: </td>
				<td>
					JAVA <input type="checkbox">
					PHP <input type="checkbox">
					NODEJS <input type="checkbox">
				</td>
			</tr>

			<tr>
				<td>DATE OF BIRTH: </td>
				<td> <input type="date" value="2024-04-22"> </td>	
			</tr>

			<tr>
				<td>EMAIL: </td>
				<td> <input type="email"> </td>
			</tr>

			<tr>
				<td>PASSWORD: </td>
				<td> <input type="password"> </td>
			</tr>

		</table>

		<div>
				<td>
					<input type="submit" value="Register">
					&nbsp;&nbsp;
					<input type="reset" value="Clear">
				</td>
		</div>

</body>
</html>
