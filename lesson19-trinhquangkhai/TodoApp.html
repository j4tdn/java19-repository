<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TODO APP</title>
	<link rel="stylesheet"  href="./style.css">
</head>

<style>
	#main{
	background-color: rgb(86, 119, 201, 1.0);
	height: 500px;
	width: 600px;

	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%,-50%); 

	border-radius: 11%;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

#text {
	
	width: 100%;
	height: 25%;
	font-size: 300%;

	display: flex;
	justify-content: center;
	align-items: center;
}

#note {
	background-color: white;
	height: 15%;
	width: 100%;
	display: flex;

}

#note  input{
	background-color: white;
	height: 100%;
	width: 80%;
	border-width: 1px;
	padding: 0;
	box-sizing: border-box;
	font-size: 150%;
	text-align: left;

}

#note  button{
	box-sizing: border-box;
	height: 100%;
	width: 20%;
	background-color: skyblue;
	font-size: 200%;
	color: blue;
}

.task{
	height: 15%;
	width: 100%;
	background-color: white;
	background-color: skyblue;
	display: flex;
}

.task > .input{
	box-sizing: border-box;
	width: 10%;
	height: 100%;
	border-width:45%;
	display: flex;
	justify-content: center;
	align-items: center;
}

.task > .content{
	background-color: white;
	width: 70%;
	height: 100%;
	box-sizing: border-box;
	font-size: 200%;
}

.task  button{
	box-sizing: border-box;
	height: 100%;
	width: 20%;
	background-image: url('./images/trash.svg');
	background-repeat: no-repeat;

	background-position: center;
	background-color: skyblue;
	background-size: 30%;
}
</style>


<body>
	<div id="main">
		<div id="text">TODO LIST - APP</div>
		<div id="note">
			<input placeholder="A Task You Want To Complete">
			<button>+</button>
		</div>

		<div class="task">
			<div class="input"><input type="checkbox"></div>
			<input class="content" placeholder="Task 01"> 
			<button></button>
		</div>

		<div class="task">
			<div class="input"><input type="checkbox"></div>
			<input class="content" placeholder="Task 02">
			<button></button>
		</div>

		<div class="task">
			<div class="input"><input type="checkbox"></div>
			<input class="content" placeholder="Task 03">
			<button></button>
		</div>

		<div class="task">
			<div class="input"><input type="checkbox"></div>
			<input class="content" placeholder="Task 04">
			<button></button>
		</div>

	</div>



</body>
</html>
