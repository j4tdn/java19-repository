<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" type="images/header.png">
	<link rel="stylesheet"  href="css/style.css">
	<title>Ex08 - CSS Background Properties</title>
	<style>

		body {
			background-color: #c6e0b4;
		}

		.w8h4 {
			width: 800px;
			height: 400px;
		}

		.whx {
			width: 630px;
			height: 730px;
		}

		.m-center {
			margin: 50px auto;

		}

		#bg-elm-1 {
			background-color: purple;
			background-image: url(images/cupcake.png);
			background-repeat: no-repeat;
			background-size: 200px 200px;
			background-position: center center;
		}

		#bg-elm-2 {
			background-color: orange;
			background-image: url(images/cupcake.png);

			/*Yêu cầu: w/h của element phải tỉ lệ với m/h của background-image*/
			background-size: cover;
		

		}

	</style>
</head>
<body>
		<h2 class="text-center title">Page - Ex08 Background Properties</h2>
		<hr>

		
			<div class="m-center w8h4" id="bg-elm-1"></div>
			<div class="m-center whx" id="bg-elm-2"></div>
	


</body>
</html>
