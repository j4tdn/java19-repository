<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" type="images/header.png">
	<link rel="stylesheet"  href="css/style.css">
	<title>Ex10 - CSS Display & Visibility Properties</title>
	<style>

		.block {
			width: 200px;
			height: 200px;
			display: inline-block;
		}

		.orange {
			background-color: orange;
		}

		.green {
			background-color: green;
			/*display: none;*/
			visibility: hidden;
		}

		.blue {
			background-color: blue;
		}
	</style>
	<body>
		<h2 class="text-center title"> Css Display & Visibility Properties</h2>
		<hr>

		<div class="block orange">Orange</div>
		<div class="block green">Green</div>
		<div class="block blue">Blue</div>
	</body>
</head>
</html>
