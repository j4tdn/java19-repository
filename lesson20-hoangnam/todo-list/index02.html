<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO List - App</title>
<link rel="stylesheet" href="style02.css">
</head>
<body>
  
<div class="todo-app">
  <div class="header">
    <h1>TODO LIST - APP</h1>
  </div>
  <div class="add-task">
    <input type="text" placeholder="A task you want to complete">
    <button class="add-button">+</button>
  </div>
  <ul class="task-list">
    <li>
      <input type="checkbox" id="task-1">
      <label for="task-1">Task 01</label>
      <button class="delete-button"><img src="img02/trash.svg" alt="Delete"></button>
    </li>
    <li>
      <input type="checkbox" id="task-2">
      <label for="task-2">Task 02</label>
      <button class="delete-button"><img src="img02/trash.svg" alt="Delete"></button>
    </li>
    <li>
      <input type="checkbox" id="task-3">
      <label for="task-3">Task 03</label>
      <button class="delete-button"><img src="img02/trash.svg" alt="Delete"></button>
    </li>
    <li>
      <input type="checkbox" id="task-4">
      <label for="task-4">Task 04</label>
      <button class="delete-button"><img src="img02/trash.svg" alt="Delete"></button>
    </li>
  </ul>
</div>
</body>
</html>
