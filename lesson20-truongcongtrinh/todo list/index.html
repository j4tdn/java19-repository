<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TODO APP</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="https://kit.fontawesome.com/766ccaa93a.js" crossorigin="anonymous"></script>
</head>

<body>
	<div class="wrapper">
		<h1 id="warning">Oops... Task's content cannot be EMPTY !!!</h1>
		<div class="todo-list-app">
			<h1 class="title">TODO List - App</h1>
			<ul>
				<li class="row">
					<input type="text" name="" id="input-task" placeholder="A task you want to complete">
					<div class="icon">
						<i class="icon-plus fa-solid fa-plus"></i>
					</div>
				</li>
				<li class="row">
					<div class="checkbox">
						<input type="checkbox">
					</div>
					<div class="task-name"><span>Task 01</span></div>
					<div class="icon">
						<img src="./images/trash.svg" alt="">
					</div>
				</li>
				<li class="row">
					<div class="checkbox">
						<input type="checkbox">
					</div>
					<div class="task-name"><span>Task 02</span></div>
					<div class="icon">
						<img src="./images/trash.svg" alt="">
					</div>
				</li>
				<li class="row">
					<div class="checkbox">
						<input type="checkbox">
					</div>
					<div class="task-name"><span>Task 03</span></div>
					<div class="icon">
						<img src="./images/trash.svg" alt="">
					</div>
				</li>
				<li class="row">
					<div class="checkbox">
						<input type="checkbox">
					</div>
					<div class="task-name"><span>Task 04</span></div>
					<div class="icon">
						<img src="./images/trash.svg" alt="">
					</div>
				</li>
			</ul>
		</div>
	</div>
</body>

</html>
